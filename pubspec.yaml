name: kh_driving_rule
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/data/theory_data.json
    - assets/images/
  #   - images/a_dot_ham.jpeg


  fonts:
    - family: KohSantepheap
      fonts:
        - asset: assets/fonts/KohSantepheap-Regular.ttf
        - asset: assets/fonts/KohSantepheap-Bold.ttf
        
